<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2 German - Arbab Khan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1931">
<style>
body{margin:0; min-height:100vh; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('bg.jpg'); background-size:cover; background-position:center; background-attachment:fixed; font-family: sans-serif; color:white; display:flex; align-items:center; justify-content:center; padding:15px}
.card{background:rgba(255,255,255,0.95); color:#111; padding:25px; border-radius:20px; width:100%; max-width:500px; box-shadow:0 10px 30px rgba(0,0,0,0.5)}
h1{text-align:center; color:#0a1931} textarea{width:100%; height:120px; border-radius:12px; padding:12px; border:2px solid #ddd; font-size:16px} button{width:100%; padding:14px; background:#0a1931; color:white; border:none; border-radius:12px; font-size:18px; margin-top:12px; cursor:pointer} #result{margin-top:15px; padding:15px; background:#f0f4ff; border-radius:12px; min-height:50px; color:#111; font-weight:bold; white-space:pre-wrap}.offline-badge{position:fixed; top:10px; right:10px; background:green; color:white; padding:5px 10px; border-radius:20px; font-size:12px}
</style>
</head>
<body>
<div class="offline-badge" id="status">● Online</div>
<div class="card">
<h1>🇩🇪 B2 German AI<br><small style="font-size:12px">By Arbab Khan Jandran</small></h1>
<p style="text-align:center; font-size:13px">Gujranwala → Germany | 100% Offline Ready</p>
<textarea id="input" placeholder="Urdu / English likhein..."></textarea>
<button onclick="translateText()">Translate to German B2</button>
<div id="result">Translation yahan ayega...</div>
<button onclick="speak()" style="background:#185ADB">🔊 Suno</button>
</div>
<script>
// Offline Translation Dictionary - Bina Google Ke
const dict = {"hello":"Hallo","how are you":"Wie geht es dir","i am fine":"Mir geht es gut","thank you":"Danke","what is your name":"Wie heißt du","my name is":"Mein Name ist","i want to go to germany":"Ich möchte nach Deutschland gehen","i am from gujranwala":"Ich komme aus Gujranwala","good morning":"Guten Morgen","good night":"Gute Nacht","please":"Bitte","yes":"Ja","no":"Nein","water":"Wasser","food":"Essen","help":"Hilfe","i love you":"Ich liebe dich","friend":"Freund","work":"Arbeit","study":"Studium","germany":"Deutschland","pakistan":"Pakistan"};

function translateText(){
 let text = document.getElementById('input').value.toLowerCase().trim();
 if(!text){document.getElementById('result').innerText="Kuch likhein..."; return;}
 // Simple offline logic
 if(dict[text]){document.getElementById('result').innerText=dict[text];}
 else {
   // B2 Style conversion
   let out = text.replace(/i am/g, "Ich bin").replace(/i want/g, "Ich möchte").replace(/going/g, "gehen");
   document.getElementById('result').innerText = "[Offline B2]: " + out + "\n\n(Tip: Internet par hote to behtar German milta)";
 }
 if('speechSynthesis' in window){/*ready*/}
}
function speak(){
 let t = document.getElementById('result').innerText;
 let u = new SpeechSynthesisUtterance(t); u.lang='de-DE'; speechSynthesis.speak(u);
}
// PWA Offline
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
window.addEventListener('online', ()=>{document.getElementById('status').innerText="● Online"; document.getElementById('status').style.background="green"});
window.addEventListener('offline', ()=>{document.getElementById('status').innerText="● Offline - Chal Rahi Hai"; document.getElementById('status').style.background="orange"});
</script>
</body>
</html>
